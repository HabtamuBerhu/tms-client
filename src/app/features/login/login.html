<div class="login-page">

  <div class="login-card">

    <div class="login-header">

      <div class="logo">
        T
      </div>

      <h1>
        Welcome Back
      </h1>

      <p>
        Sign in to TMS
      </p>

    </div>


    @if (errorMessage()) {

      <div class="error-message">
        {{ errorMessage() }}
      </div>

    }


    <form
      class="login-form"
      (ngSubmit)="login()"
      #loginForm="ngForm"
    >

      <div class="form-group">

        <label for="email">
          email
        </label>

        <div class="input-wrapper">

          <input
            id="email"
            name="email"
            type="text"
            [(ngModel)]="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
          />

        </div>

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <div class="input-wrapper">

          <input
            id="password"
            name="password"
            [type]="showPassword() ? 'text' : 'password'"
            [(ngModel)]="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />

          <button
            type="button"
            class="password-toggle"
            (click)="togglePassword()"
          >
            {{ showPassword() ? 'Hide' : 'Show' }}
          </button>

        </div>

      </div>


      <button
        type="submit"
        class="login-button"
        [disabled]="loading() || loginForm.invalid"
      >

        @if (loading()) {

          <span class="loading-content">

            <span class="spinner"></span>

            Signing in...

          </span>

        } @else {

          Sign In

        }

      </button>

    </form>


    <div class="login-footer">
      TMS &copy; 2026 · Training Management System
    </div>

  </div>

</div>
